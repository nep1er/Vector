<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vector — управление проектами</title>
    <script>
      // Применяем тему до отрисовки, чтобы страница не мигала
      try {
        var t = localStorage.getItem('vector_theme');
        var v3 = localStorage.getItem('vector_theme_v') === '3';
        var map = { 'system-light': 'light', 'system-dark': 'dark', light: 'plain-light', dark: 'plain-dark' };
        var attr;
        if (t === 'system-light' || t === 'system-dark') attr = map[t];
        else if ((t === 'light' || t === 'dark') && v3) attr = map[t];
        else if (t === 'light') attr = 'light';
        else if (t === 'dark') attr = 'dark';
        else attr = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', attr);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
